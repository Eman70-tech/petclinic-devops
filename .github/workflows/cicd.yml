name: CICD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]  

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      nexus:
        image: sonatype/nexus3:latest
        ports:
          - 8081:8081
          - 8082:8082
        options: >-
          --health-cmd "curl -f http://localhost:8081 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4

      - name: set up java 
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'adopt'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven Wrapper
        run: ./mvnw -B verify -Dtest=!PostgresIntegrationTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # --------------------------------
      # Get Nexus initial admin password
      # --------------------------------
      - name: Get Nexus initial admin password
        id: nexus_init_pass
        run: |
          NEXUS_INITIAL_PASS=$(docker exec ${{ job.services.nexus.id }} \
            cat /nexus-data/admin.password)

          echo "pass=$NEXUS_INITIAL_PASS" >> "$GITHUB_OUTPUT"


      # --------------------------------
      # Verify initial credentials
      # --------------------------------
      - name: Verify Nexus initial credentials
        run: |
          curl -fS \
            -u "admin:${{ steps.nexus_init_pass.outputs.pass }}" \
            http://localhost:8081/service/rest/v1/status


      # --------------------------------
      # Change admin password
      # --------------------------------
      - name: Change Nexus admin password
        run: |
          curl -fS \
            -u "admin:${{ steps.nexus_init_pass.outputs.pass }}" \
            -X PUT \
            -H "Content-Type: text/plain" \
            --data "${{ secrets.NEXUS_PASSWORD }}" \
            http://localhost:8081/service/rest/v1/security/users/admin/change-password


      # --------------------------------
      # Verify new admin password
      # --------------------------------
      - name: Verify new Nexus credentials
        run: |
          curl -fS \
            -u "admin:${{ secrets.NEXUS_PASSWORD }}" \
            http://localhost:8081/service/rest/v1/status


      # --------------------------------
      # Activate Docker realms
      # --------------------------------
      - name: Activate Docker Bearer Token Realm
        run: |
          curl -fS \
            -u "admin:${{ secrets.NEXUS_PASSWORD }}" \
            -X PUT \
            -H "Content-Type: application/json" \
            --data '["NexusAuthenticatingRealm","DockerToken"]' \
            http://localhost:8081/service/rest/v1/security/realms/active


      # --------------------------------
      # Check active realms
      # --------------------------------
      - name: Check active Nexus realms
        run: |
          curl -fS \
            -u "admin:${{ secrets.NEXUS_PASSWORD }}" \
            http://localhost:8081/service/rest/v1/security/realms/active


      # --------------------------------
      # Create Docker hosted repository
      # --------------------------------
      - name: Create Docker hosted repository
        run: |
          curl -fS \
            -u "admin:${{ secrets.NEXUS_PASSWORD }}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{
              "name": "spring-petclinic",
              "online": true,
              "storage": {
                "blobStoreName": "default",
                "strictContentTypeValidation": true,
                "writePolicy": "ALLOW"
              },
              "docker": {
                "v1Enabled": false,
                "forceBasicAuth": true,
                "httpPort": 8082,
                "httpsPort": null
              }
            }' \
            http://localhost:8081/service/rest/v1/repositories/docker/hosted


      # --------------------------------
      # Verify Docker repository
      # --------------------------------
      - name: Verify Docker repository
        run: |
          curl -fS \
            -u "admin:${{ secrets.NEXUS_PASSWORD }}" \
            http://localhost:8081/service/rest/v1/repositories/docker/hosted/spring-petclinic


      # --------------------------------
      # Test Docker Registry endpoint
      # --------------------------------
      - name: Test Docker Registry endpoint
        run: |
          curl -i \
            http://localhost:8082/v2/


      # --------------------------------
      # Login to Nexus Docker Registry
      # --------------------------------
      - name: Log in to Nexus
        uses: docker/login-action@v3
        with:
          registry: localhost:8082
          username: admin
          password: ${{ secrets.NEXUS_PASSWORD }}



      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            spring-petclinic:latest
            localhost:8081/spring-petclinic/spring-petclinic:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'spring-petclinic:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


      - name: Push image to Nexus
        run: docker push localhost:8081/spring-petclinic/spring-petclinic:latest