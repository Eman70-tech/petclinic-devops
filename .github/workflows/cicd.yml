name: CICD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]  

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      nexus:
        image: sonatype/nexus3:3.70.1
        ports:
          - 8081:8081
          - 8082:8082
        options: >-
          --health-cmd "curl -f http://localhost:8081 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      sonarqube:
        image: sonarqube:lts-community
        ports:
          - 9000:9000
        env:
          SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false

    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up java 
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'adopt'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven Wrapper
        run: ./mvnw -B verify -Dtest=!PostgresIntegrationTests
      
      #=============================================================================================================#
      - name: Wait for SonarQube and create token
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -s http://localhost:9000/api/system/status | jq -r '.status' 2>/dev/null || true)
            [ "$STATUS" = "UP" ] && break
            sleep 10
          done
          [ "$STATUS" = "UP" ] || { echo "SonarQube did not start"; exit 1; }

          TOKEN=$(curl -fS -u admin:admin -X POST \
            http://localhost:9000/api/user_tokens/generate \
            -d "name=ci" | jq -r '.token')
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: SonarQube analysis
        run: |
          ./mvnw -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey=spring-petclinic
            

      - name: Show SonarQube results
        run: |
          CE_URL=$(grep ceTaskUrl target/sonar/report-task.txt | cut -d= -f2-)
          CE_STATUS=""
          for i in $(seq 1 30); do
            CE_STATUS=$(curl -s -u "$SONAR_TOKEN:" "$CE_URL" | jq -r '.task.status')
            [ "$CE_STATUS" = "SUCCESS" ] && break
            sleep 5
          done
          [ "$CE_STATUS" = "SUCCESS" ] || { echo "Sonar analysis task did not finish"; exit 1; }

          echo "=== Measures ==="
          curl -s -u "$SONAR_TOKEN:" \
            "http://localhost:9000/api/measures/component?component=spring-petclinic&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density" \
            | jq '.component.measures'

          echo "=== Quality Gate ==="
          GATE_JSON=$(curl -s -u "$SONAR_TOKEN:" \
            "http://localhost:9000/api/qualitygates/project_status?projectKey=spring-petclinic")
          echo "$GATE_JSON" | jq '.projectStatus'

          GATE_STATUS=$(echo "$GATE_JSON" | jq -r '.projectStatus.status')
          echo "GATE_STATUS=$GATE_STATUS"
          [ "$GATE_STATUS" = "OK" ] || { echo "Quality gate failed: $GATE_STATUS"; exit 1; }
#================================================================================================================#

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            spring-petclinic:latest
            localhost:8082/spring-petclinic:latest
            petclinic-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'spring-petclinic:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


      - name: Get Nexus admin password
        run: |
          NEXUS_CONTAINER=$(docker ps -q --filter "name=nexus" | head -n1)
          if [ -z "$NEXUS_CONTAINER" ]; then
            echo "Nexus container not found"; docker ps -a; exit 1
          fi
          echo "Using container $NEXUS_CONTAINER"
          for i in $(seq 1 30); do
            docker exec "$NEXUS_CONTAINER" test -f /nexus-data/admin.password && break
            sleep 5
          done
          NEXUS_PASS=$(docker exec "$NEXUS_CONTAINER" cat /nexus-data/admin.password)
          echo "::add-mask::$NEXUS_PASS"
          echo "NEXUS_PASS=$NEXUS_PASS" >> "$GITHUB_ENV"

      - name: Create Docker hosted repository in Nexus
        run: |
          HTTP=$(curl -s -o resp.txt -w "%{http_code}" -u admin:"$NEXUS_PASS" \
            -X POST "http://localhost:8081/service/rest/v1/repositories/docker/hosted" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "docker-hosted",
              "online": true,
              "storage": {"blobStoreName": "default", "strictContentTypeValidation": true, "writePolicy": "allow"},
              "docker": {"v1Enabled": false, "forceBasicAuth": true, "httpPort": 8082}
            }')
          echo "HTTP $HTTP"; cat resp.txt
          [ "$HTTP" = "201" ] || exit 1

      - name: Enable Docker Bearer Token Realm
        run: |
          HTTP=$(curl -s -o resp.txt -w "%{http_code}" -u admin:"$NEXUS_PASS" \
            -X PUT "http://localhost:8081/service/rest/v1/security/realms/active" \
            -H "Content-Type: application/json" \
            -d '["NexusAuthenticatingRealm", "DockerToken"]')
          echo "HTTP $HTTP"; cat resp.txt
          [ "$HTTP" = "204" ] || exit 1

      - name: Verify Nexus credentials before pushing
        run: |
          sleep 5
          curl -s -o /dev/null -w "registry /v2/ -> %{http_code}\n" \
            -u admin:"$NEXUS_PASS" http://localhost:8082/v2/
      - name: Push image to Nexus
        run: |
          docker tag petclinic-app:${{ github.sha }} localhost:8082/petclinic-app:latest
          echo "$NEXUS_PASS" | docker login localhost:8082 -u admin --password-stdin
          docker push localhost:8082/petclinic-app:latest