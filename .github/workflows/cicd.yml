name: CICD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]  

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      nexus:
        image: sonatype/nexus3:latest
        ports:
          - 8081:8081
          - 8082:8082
        options: >-
          --health-cmd "curl -f http://localhost:8081 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      sonarqube:
        image: sonarqube:lts-community
        ports:
          - 9000:9000
        env:
          SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false

    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up java 
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'adopt'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven Wrapper
        run: ./mvnw -B verify -Dtest=!PostgresIntegrationTests
      
      #=============================================================================================================#
      - name: Wait for SonarQube and create token
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -s http://localhost:9000/api/system/status | jq -r '.status' 2>/dev/null || true)
            [ "$STATUS" = "UP" ] && break
            sleep 10
          done
          [ "$STATUS" = "UP" ] || { echo "SonarQube did not start"; exit 1; }

          TOKEN=$(curl -fS -u admin:admin -X POST \
            http://localhost:9000/api/user_tokens/generate \
            -d "name=ci" | jq -r '.token')
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: SonarQube analysis
        run: |
          ./mvnw -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey=spring-petclinic
#================================================================================================================#

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            spring-petclinic:latest
            localhost:8081/spring-petclinic/spring-petclinic:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'spring-petclinic:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


      - name: Push image to Nexus
        run: docker push localhost:8081/spring-petclinic/spring-petclinic:latest